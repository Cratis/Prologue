name: Publish

# Never cancel a release in flight. Pushes and manual releases share one group, so a later run cannot kill one
# that may already have tagged and cut the release but not yet finished publishing. This also retires the
# pull_request-trigger hazard where closing several consolidated pull requests started competing releases.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET_VERSION: "10.0.x"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  push:
    branches:
      - main
    # A dependency bump changes no file under Source and still changes what ships, so changes to the
    # repository-level build props and targets must trigger the same release path as source changes.
    paths:
      - "Source/**"
      - "*.props"
      - "*.targets"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.intent.outputs.reason || steps.release.outputs.reason }}

    steps:
      # The pre-merge check gives quick feedback, but labels can change or required checks can be bypassed. Resolve
      # the merged pull request again on the trusted push and require its release intent before invoking the action.
      - name: Resolve release intent
        id: intent
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          associated_pages=$(
            gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls?per_page=100"
          )
          associated=$(printf '%s' "$associated_pages" | jq -c 'add')
          merged=$(printf '%s' "$associated" | jq -c '[.[] | select(.merged == true or .merged_at != null)]')
          exact=$(printf '%s' "$merged" | jq -c --arg sha "$COMMIT_SHA" '[.[] | select(.merge_commit_sha == $sha)]')
          exact_count=$(printf '%s' "$exact" | jq 'length')
          pull_request=''

          if [ "$exact_count" -gt 1 ]; then
            echo "::error::Commit ${COMMIT_SHA} matches more than one merged pull request by merge_commit_sha; refusing to guess the release intent."
            exit 1
          elif [ "$exact_count" -eq 1 ]; then
            pull_request=$(printf '%s' "$exact" | jq -c '.[0]')
          else
            commit_message=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}" --jq '.commit.message')
            if [[ "$commit_message" =~ Merge[[:space:]]pull[[:space:]]request[[:space:]]#([0-9]+)[[:space:]]from ]]; then
              pull_request_number=${BASH_REMATCH[1]}
              candidate=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_request_number}")
              if printf '%s' "$candidate" | jq -e '.merged == true or .merged_at != null' > /dev/null; then
                pull_request=$(printf '%s' "$candidate" | jq -c '.')
              fi
            fi
          fi

          if [ -z "$pull_request" ]; then
            merged_count=$(printf '%s' "$merged" | jq 'length')
            if [ "$merged_count" -gt 1 ]; then
              numbers=$(printf '%s' "$merged" | jq -r 'map(.number | tostring) | join(", ")')
              echo "::error::Commit ${COMMIT_SHA} is associated with multiple merged pull requests (${numbers}); refusing to guess the release intent."
              exit 1
            elif [ "$merged_count" -eq 1 ]; then
              pull_request=$(printf '%s' "$merged" | jq -c '.[0]')
            else
              echo "No merged pull request found for ${COMMIT_SHA}; treating it as a direct push and leaving the decision to release-action."
              exit 0
            fi
          fi

          pull_request_number=$(printf '%s' "$pull_request" | jq -r '.number')
          release_intents=$(printf '%s' "$pull_request" | jq -c '[.labels[]?.name | select(. == "major" or . == "minor" or . == "patch" or . == "no-release")]')
          intent_count=$(printf '%s' "$release_intents" | jq 'length')

          if [ "$intent_count" -ne 1 ]; then
            intents=$(printf '%s' "$release_intents" | jq -r 'if length == 0 then "none" else join(", ") end')
            echo "::error::Merged pull request #${pull_request_number} has ${intent_count} release-intent labels (${intents}); exactly one of major, minor, patch, or no-release is required."
            exit 1
          fi

          release_intent=$(printf '%s' "$release_intents" | jq -r '.[0]')
          echo "Merged pull request #${pull_request_number} has release intent '${release_intent}'."
          if [ "$release_intent" = 'no-release' ]; then
            echo "no_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-release" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.intent.outputs.no_release != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release
        id: release
        if: steps.intent.outputs.no_release != 'true'
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-dotnet-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    permissions:
      contents: read
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Build
        run: dotnet build --configuration Release

      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  publish-docker-images:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: cratis/prologue-extractor
            dockerfile: Source/Extractor/Dockerfile
          - image: cratis/prologue-interpreter
            dockerfile: Source/Interpreter/Dockerfile
          - image: cratis/prologue-receiver
            dockerfile: Source/Receiver/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ matrix.image }}:${{ needs.release.outputs.version }}
            ${{ matrix.image }}:latest

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - an explicit no-release intent, a commit pushed straight to main, a Dependabot merge, or a re-run
    # of a run that already released - and failing on those would make this job noise that everyone ignores.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one release-intent label (major, minor, patch, or no-release) to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
