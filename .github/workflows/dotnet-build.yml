name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Samples/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/dotnet-build.yml"
      - ".github/scripts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Release is the warnings-as-errors gate. It also strips the inline specs (see
      # Source/Directory.Build.targets), so it builds only — the specs are run below.
      - name: Build (Release)
        run: dotnet build --configuration Release

      # The inline specs only exist in Debug; Release output must not be used to run them.
      - name: Build (Debug)
        run: dotnet build --configuration Debug

      - name: Check native runner guard
        run: python3 -B .github/scripts/test_run_specs.py

      # Run each non-empty native suite explicitly. Library integration tests require Docker
      # and browsers and are not run here; see Samples/Library/README.md.
      - name: Run Configuration specs
        run: python3 .github/scripts/run-specs.py Source/Configuration/Configuration.csproj -trait- Category=Integration

      - name: Run Screenplay specs
        run: python3 .github/scripts/run-specs.py Source/Screenplay/Screenplay.csproj -trait- Category=Integration

      - name: Run Extractor specs
        run: python3 .github/scripts/run-specs.py Source/Extractor.Specs/Extractor.Specs.csproj -trait- Category=Integration

      - name: Run Interpretation specs
        run: python3 .github/scripts/run-specs.py Source/Interpretation/Interpretation.csproj -trait- Category=Integration

      - name: Run Interpreter specs
        run: python3 .github/scripts/run-specs.py Source/Interpreter.Specs/Interpreter.Specs.csproj -trait- Category=Integration
